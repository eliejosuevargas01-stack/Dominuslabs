server {
    listen 80;
    server_name _;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to FastAPI Backend
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_api "http://backend:8000";
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime / SSE Stream Settings
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Static Media / Uploads Proxy
    location /uploads/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_uploads "http://backend:8000";
        proxy_pass $backend_uploads;
        proxy_set_header Host $host;
    }

    # WebSockets Proxy
    location /ws/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_ws "http://backend:8000";
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
