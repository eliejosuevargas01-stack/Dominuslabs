services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dominus_backend
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND:-8000}:8000"
    environment:
      - PORT=8000
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ADMIN_TENANT_ID=${ADMIN_TENANT_ID:?ADMIN_TENANT_ID is required}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET is required}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      - DATABASE_URL=${DATABASE_URL:-}
      - IDENTITY_WORKER_URL=${IDENTITY_WORKER_URL:?IDENTITY_WORKER_URL is required}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:?WHATSAPP_API_URL is required}
      - DOMINUS_PRIVATE_KEY=${DOMINUS_PRIVATE_KEY:?DOMINUS_PRIVATE_KEY is required}
      - DOMINUS_PUBLIC_KEY=${DOMINUS_PUBLIC_KEY:?DOMINUS_PUBLIC_KEY is required}
      - IDPW_PUBLIC_KEY=${IDPW_PUBLIC_KEY:?IDPW_PUBLIC_KEY is required}
      - WHATS_API_PUBLIC_KEY=${WHATS_API_PUBLIC_KEY:?WHATS_API_PUBLIC_KEY is required}
      - N8N_PUBLIC_KEY=${N8N_PUBLIC_KEY:?N8N_PUBLIC_KEY is required}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - dominus_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: dominus_frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-80}:80"
    depends_on:
      - backend
    networks:
      - dominus_net

volumes:
  backend_uploads:

networks:
  dominus_net:
    driver: bridge
